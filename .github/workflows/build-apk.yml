
name: Build TouchX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TouchX-Sensitivity-fixed-v0.1.1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          test -f TouchX-Sensitivity-fixed-v0.1.1.zip
          unzip -q TouchX-Sensitivity-fixed-v0.1.1.zip
          test -f TouchX-Sensitivity/settings.gradle
          test -f TouchX-Sensitivity/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: TouchX-Sensitivity
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchX-Sensitivity-debug-APK
          path: TouchX-Sensitivity/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
